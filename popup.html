<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; style-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoho Remaining Work Time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Icon library (FA-style outlines, single sprite — referenced via <use href="#id">) -->
  <svg class="icon-sprite" aria-hidden="true">
    <defs>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </g>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </g>
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
        </g>
      </symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2"/>
          <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>
        </g>
      </symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h14v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/>
          <path d="M18 9h2a2 2 0 0 1 0 4h-2"/>
          <path d="M7 3v2M11 3v2M15 3v2"/>
        </g>
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
      </symbol>
      <symbol id="i-sign-in" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="M10 17l5-5-5-5M15 12H3"/>
        </g>
      </symbol>
      <symbol id="i-sign-out" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5M21 12H9"/>
        </g>
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M16 3v4M8 3v4M3 10h18"/>
        </g>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7.1 4.7l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </g>
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M10 14L21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <main class="app">
    <!-- Employee header -->
    <header class="emp-header" id="empHeader">
      <div class="emp-avatar" id="empAvatar">—</div>
      <div class="emp-meta">
        <div class="emp-name" id="empName">Loading…</div>
        <div class="emp-role" id="empRole">—</div>
      </div>
      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" title="Toggle theme">
          <svg class="ico" id="themeIco"><use href="#i-moon"></use></svg>
        </button>
        <button id="refreshBtn" class="icon-btn" title="Refresh">
          <svg class="ico"><use href="#i-refresh"></use></svg>
        </button>
      </div>
    </header>

    <!-- Hero: remaining time -->
    <section class="hero" id="hero">
      <div class="hero-label">
        <span id="liveDot" class="live-dot hidden"></span>
        <span id="heroLabel">Remaining to clock out</span>
      </div>
      <div class="hero-time" id="remainingVal">--:--:--</div>
      <div class="hero-sub">
        <span class="sub-chip">
          <svg class="ico"><use href="#i-target"></use></svg>
          Target <strong id="targetDisplay">08:00:00</strong>
        </span>
        <span class="sub-chip">
          <svg class="ico"><use href="#i-clock"></use></svg>
          ETA <strong id="relieveVal">—</strong>
        </span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div id="overtimeRow" class="overtime hidden">
        <span class="ot-label">Overtime</span>
        <span class="ot-value" id="overtimeVal">+00:00:00</span>
      </div>
    </section>

    <!-- Today stats grid -->
    <section class="stats">
      <div class="stat">
        <span class="stat-icon"><svg class="ico"><use href="#i-briefcase"></use></svg></span>
        <div class="stat-body">
          <div class="stat-label">Worked</div>
          <div class="stat-value" id="workedVal">—</div>
        </div>
      </div>
      <div class="stat">
        <span class="stat-icon"><svg class="ico"><use href="#i-coffee"></use></svg></span>
        <div class="stat-body">
          <div class="stat-label">Break</div>
          <div class="stat-value" id="breakVal">—</div>
        </div>
      </div>
    </section>

    <!-- Punches -->
    <section class="card">
      <div class="card-title">
        <span class="card-title-left">
          <svg class="ico"><use href="#i-clock"></use></svg>
          Today's Punches
        </span>
        <span class="card-meta" id="punchCount">—</span>
      </div>
      <div id="punchesVal" class="punches">—</div>
    </section>

    <!-- Weekly summary -->
    <details class="card week-card">
      <summary class="card-title">
        <span class="card-title-left">
          <svg class="ico"><use href="#i-calendar"></use></svg>
          Weekly Summary
        </span>
        <span class="card-meta">7 days</span>
      </summary>
      <div id="weekTable" class="week-table"></div>
      <div id="weekTotals" class="week-totals"></div>
    </details>

    <!-- Settings -->
    <details class="card">
      <summary class="card-title">
        <span class="card-title-left">
          <svg class="ico"><use href="#i-settings"></use></svg>
          Settings
        </span>
      </summary>
      <div class="setting">
        <label for="targetSelect">Permission</label>
        <select id="targetSelect">
          <option value="00:00">No permission (default)</option>
          <option value="01:00">1 hr permission</option>
          <option value="01:30">1 hr 30 min permission</option>
          <option value="02:00">2 hr permission</option>
        </select>
      </div>
      <div class="setting-actions">
        <button id="saveTargetBtn" class="primary-btn">Save</button>
      </div>
    </details>

    <!-- Status / error -->
    <div id="errorRow" class="alert hidden"></div>
    <div id="noteRow" class="note"></div>

    <!-- Footer -->
    <footer class="footer">
      <span>Built by</span>
      <a id="devLink" href="https://yegappan.pages.dev/" target="_blank" rel="noopener">
        Yega <svg class="ico"><use href="#i-external"></use></svg>
      </a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
